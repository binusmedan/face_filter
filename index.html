        // ================== CONFETTI + CELEBRATION ==================
        const CONFETTI_COLORS = ['#e53935', '#ffc107', '#ffffff', '#1e88e5', '#43a047', '#ff4fa3', '#ff9800'];
        const confetti = [];
        const party = { start: -1, until: -1, x: 0, y: 0, seen: false, logo: 'binus', confetti: true };
        let rainAcc = 0;

        function addConfetti(x, y, vx, vy) {
            if (confetti.length >= CFG.MAX_CONFETTI) return;
            const k = H / 720;
            const shape = Math.random() < 0.6 ? 0 : (Math.random() < 0.5 ? 1 : 2);   // 0 kotak, 1 bulat, 2 pita panjang
            confetti.push({
                x, y, vx, vy, k, shape,
                w: (shape === 2 ? 5 : 9 + Math.random() * 6) * k,
                h: (shape === 2 ? 22 + Math.random() * 14 : 6 + Math.random() * 6) * k,
                color: CONFETTI_COLORS[(Math.random() * CONFETTI_COLORS.length) | 0],
                rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 10,
                phase: Math.random() * Math.PI * 2, vp: 6 + Math.random() * 8, life: 0
            });
        }

        function burstConfetti(ox, oy) {
            const k = H / 720;
            for (let i = 0; i < 150; i++) {
                const a = -Math.PI * (0.05 + Math.random() * 0.9), sp = (350 + Math.random() * 650) * k;
                addConfetti(ox, oy, Math.cos(a) * sp, Math.sin(a) * sp);
            }
            // Meriam confetti dari kedua sudut bawah
            [[0, 1], [W, -1]].forEach(([x, s]) => {
                for (let i = 0; i < 90; i++) {
                    const a = -Math.PI / 2 + s * (0.35 + Math.random() * 0.35), sp = (900 + Math.random() * 600) * k;
                    addConfetti(x, H, Math.cos(a) * sp, Math.sin(a) * sp);
                }
            });
        }

        function startParty(now) {
            const wasActive = now < party.until + CFG.PARTY_FADE;
            if (!wasActive) party.start = now;            // animasi pop hanya saat baru muncul
            party.until = now + CFG.PARTY_DURATION;
            if (party.confetti) burstConfetti(party.seen ? party.x : W / 2, party.seen ? party.y : H * 0.3);
        }

        // ================== SPIDER WEB (rock sign) ==================
        const web = { start: -1, until: -1, x: 0, y: 0 };

        function startWeb(now, g) {
            if (now >= web.until + CFG.WEB_FADE) web.start = now;      // animasi menembak hanya saat baru muncul
            web.until = now + CFG.WEB_DURATION;
            web.x = g ? g.x : W / 2; web.y = g ? g.y : H / 2;
        }

        // Jaring laba-laba menyebar dari telapak tangan: jari-jari radial + cincin yang melengkung ke dalam
        function drawWeb(now) {
            let alpha = 1;
            if (now > web.until) alpha = 1 - (now - web.until) / CFG.WEB_FADE;
            if (alpha <= 0) return;
            const grow = Math.min(1, (now - web.start) / 500);
            const R = Math.max(W, H) * 0.6 * (1 - Math.pow(1 - grow, 3));
            if (R < 2) return;
            const k = H / 720, SPOKES = 14, RINGS = 10;
            const ang = i => (i / SPOKES) * Math.PI * 2 + 0.2;
            ctx.save();
            ctx.translate(web.x, web.y);
            ctx.globalAlpha = alpha;
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.shadowColor = 'rgba(190,225,255,0.9)'; ctx.shadowBlur = 6 * dpr;
            ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2 * k;
            ctx.beginPath();
            for (let i = 0; i < SPOKES; i++) { ctx.moveTo(0, 0); ctx.lineTo(Math.cos(ang(i)) * R, Math.sin(ang(i)) * R); }
            ctx.stroke();
            ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 1.3 * k;
            for (let j = 1; j <= RINGS; j++) {
                const r = R * Math.pow(j / RINGS, 1.35);
                ctx.beginPath();
                ctx.moveTo(Math.cos(ang(0)) * r, Math.sin(ang(0)) * r);
                for (let i = 0; i < SPOKES; i++) {
                    const a1 = ang(i + 1), am = (ang(i) + a1) / 2;
                    ctx.quadraticCurveTo(Math.cos(am) * r * 0.9, Math.sin(am) * r * 0.9, Math.cos(a1) * r, Math.sin(a1) * r);
                }
                ctx.stroke();
            }
            ctx.restore();
        }

        function updateDrawConfetti(dt, raining) {
            if (raining) {
                rainAcc += dt * CFG.CONFETTI_RAIN;
                while (rainAcc >= 1) { rainAcc -= 1; addConfetti(Math.random() * W, -20, (Math.random() - 0.5) * 60, 60 + Math.random() * 80); }
            }
            for (let i = confetti.length - 1; i >= 0; i--) {
                const p = confetti[i];
                p.life += dt;
                p.vy += 900 * p.k * dt;
                const drag = Math.max(0, 1 - 1.6 * dt);
                p.vx *= drag; p.vy *= drag;
                p.vy = Math.min(p.vy, 240 * p.k);              // kecepatan jatuh maksimum (melayang)
                p.phase += p.vp * dt;
                p.x += (p.vx + Math.sin(p.phase * 0.5) * 40 * p.k) * dt;
                p.y += p.vy * dt;
                p.rot += p.vr * dt;
                if (p.y > H + 40 || p.life > 9) { confetti.splice(i, 1); continue; }
                ctx.save();
                ctx.translate(p.x, p.y); ctx.rotate(p.rot);
                ctx.scale(1, Math.cos(p.phase));              // efek kertas berputar 3D
                ctx.fillStyle = p.color;
                if (p.shape === 1) { ctx.beginPath(); ctx.arc(0, 0, p.w * 0.45, 0, Math.PI * 2); ctx.fill(); }
                else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                ctx.restore();
            }
        }

        const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

        // Posisi tulisan: di atas kepala, diperhalus
        // Ikuti wajah yang membuat sign F; kalau wajah itu hilang, pakai wajah terbesar
        function updatePartyAnchor(faces) {
            if (!faces.length) return;
            let fg = faces.find(f => f.id === party.faceId);
            if (!fg) {
                fg = faces.reduce((a, b) => (b.head > a.head ? b : a));
                party.faceId = fg.id;
            }
            const tx = fg.topX, ty = fg.topY - fg.head * 0.72;
            if (!party.seen) { party.x = tx; party.y = ty; party.seen = true; }
            party.x += (tx - party.x) * 0.25; party.y += (ty - party.y) * 0.25;
            party.headW = fg.head;
        }

        function drawPartyText(now) {
            const t = (now - party.start) / 1000;
            let alpha = 1;
            if (now > party.until) alpha = 1 - (now - party.until) / CFG.PARTY_FADE;
            if (alpha <= 0) return;
            // Besar: ikut ukuran kepala, minimal 60% dan maksimal 92% lebar layar
            const w = Math.min(W * 0.92, Math.max(W * 0.6, (party.headW || W * 0.3) * CFG.LOGO_HEAD_WIDTH));
            const h = w * LOGO_H / LOGO_W;
            const s = easeOutBack(Math.min(1, t / 0.55));
            const bob = Math.sin(t * 3) * h * 0.02;
            // Tepi bawah tulisan di anchor; jaga supaya tidak keluar layar
            let cx = Math.min(W - w / 2 - 8, Math.max(w / 2 + 8, party.x));
            let cy = Math.max(h / 2 + 8, party.y - h / 2) + bob;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(cx, cy); ctx.rotate(Math.sin(t * 2) * 0.025 - 0.02); ctx.scale(s, s);
            ctx.drawImage(party.logo === 'digifest' ? digiCanvas : logoCanvas, -w / 2, -h / 2, w, h);
            // Kilau bintang di sekitar tulisan
            for (let i = 0; i < 6; i++) {
                const a = 0.5 + 0.5 * Math.sin(t * 5 + i * 1.9);
                ctx.fillStyle = `rgba(255,255,255,${0.9 * a})`;
                starPath(ctx, (Math.sin(i * 2.3) * 0.48) * w, (Math.cos(i * 1.7) * 0.42) * h, (6 + 8 * a) * (w / 700), 4);
                ctx.fill();
            }
            ctx.restore();
        }

        // ================== RENDER ==================
        function drawGlasses(fg, t) {
            ctx.save();
            ctx.translate(fg.cx, fg.cy); ctx.rotate(fg.angle); ctx.scale(fg.eye, fg.eye);
            GLASSES[styleIdx.glasses].draw(ctx, t);
            ctx.restore();
        }

        // ================== WINGS (pixel art ala Growtopia, di belakang badan) ==================
        // Sprite = sayap KANAN (mengarah ke +x). Koordinat gambar dalam satuan 0..1, pangkal sayap di WING_ROOT.
        const WING_SPR_W = 64, WING_SPR_H = 56, WING_PAD = 2;
        const WING_ROOT = { x: 0.04, y: 0.66 };

        function batWing(g, st) {
            const lw = 1 / WING_SPR_H, razor = st.kind === 'razor';
            const R = WING_ROOT, E = { x: 0.34, y: 0.26 }, Wr = { x: 0.66, y: 0.10 }, T = { x: 0.80, y: -0.02 };
            // Ujung jari (selaput terbentang di antaranya). Razor: lebih banyak gerigi.
            const F = razor
                ? [{ x: 1.0, y: 0.42 }, { x: 0.93, y: 0.62 }, { x: 0.80, y: 0.78 }, { x: 0.62, y: 0.88 }, { x: 0.42, y: 0.92 }, { x: 0.20, y: 0.86 }]
                : [{ x: 0.99, y: 0.50 }, { x: 0.80, y: 0.82 }, { x: 0.50, y: 0.93 }, { x: 0.16, y: 0.88 }];
            g.beginPath();
            g.moveTo(R.x, R.y); g.lineTo(E.x, E.y); g.lineTo(Wr.x, Wr.y); g.lineTo(F[0].x, F[0].y);
            for (let i = 1; i < F.length; i++) {
                const a = F[i - 1], b = F[i], m = mid(a, b);
                // Tepi selaput ditarik ke arah pergelangan: lengkung (bat) atau takik tajam (razor)
                const k = razor ? 0.22 : 0.3;
                const c = { x: m.x + (Wr.x - m.x) * k, y: m.y + (Wr.y - m.y) * k };
                if (razor) { g.lineTo(c.x, c.y); g.lineTo(b.x, b.y); }
                else g.quadraticCurveTo(c.x, c.y, b.x, b.y);
            }
            g.lineTo(R.x, R.y + 0.08); g.closePath();
            const grad = g.createLinearGradient(0, 0.1, 0, 0.95);
            grad.addColorStop(0, st.mem); grad.addColorStop(1, st.mem2);
            g.fillStyle = grad; g.fill();
            g.lineCap = 'round'; g.lineJoin = 'round';
            // Jari-jari rangka (tanpa jari terakhir yang menempel ke badan)
            g.strokeStyle = st.bone; g.lineWidth = 2.4 * lw;
            g.beginPath();
            F.slice(0, -1).forEach((f, i) => { if (razor && i % 2) return; g.moveTo(Wr.x, Wr.y); g.lineTo(f.x, f.y); });
            g.stroke();
            // Lengan atas (lebih tebal) + kilau
            g.lineWidth = 4 * lw;
            g.beginPath(); g.moveTo(R.x, R.y); g.lineTo(E.x, E.y); g.lineTo(Wr.x, Wr.y); g.stroke();
            g.strokeStyle = st.boneHi; g.lineWidth = 1.3 * lw;
            g.beginPath(); g.moveTo(R.x + 0.03, R.y - 0.06); g.lineTo(E.x, E.y - 0.02); g.lineTo(Wr.x, Wr.y - 0.02); g.stroke();
            // Cakar / duri di puncak
            g.fillStyle = st.tip || st.bone;
            g.beginPath(); g.moveTo(Wr.x - 0.05, Wr.y + 0.03); g.quadraticCurveTo(T.x - 0.06, T.y + 0.03, T.x, T.y); g.lineTo(Wr.x + 0.05, Wr.y + 0.02); g.closePath(); g.fill();
        }

        // Alpha dibulatkan (piksel tegas) + outline gelap 1 piksel di luar bentuk, seperti sprite Growtopia
        function pixelize(c, outline) {
            const g = c.getContext('2d');
            const img = g.getImageData(0, 0, c.width, c.height), d = img.data, w = c.width, h = c.height;
            for (let i = 3; i < d.length; i += 4) d[i] = d[i] > 110 ? 255 : 0;
            const solid = i => d[i * 4 + 3] === 255;
            const edge = [];
            for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                const i = y * w + x;
                if (solid(i)) continue;
                if ((x > 0 && solid(i - 1)) || (x < w - 1 && solid(i + 1)) || (y > 0 && solid(i - w)) || (y < h - 1 && solid(i + w))) edge.push(i);
            }
            edge.forEach(i => { d[i * 4] = outline[0]; d[i * 4 + 1] = outline[1]; d[i * 4 + 2] = outline[2]; d[i * 4 + 3] = 255; });
            g.putImageData(img, 0, 0);
        }

        function buildWingSprite(st) {
            const c = document.createElement('canvas');
            c.width = WING_SPR_W; c.height = WING_SPR_H;
            const g = c.getContext('2d');
            g.save();
            g.translate(WING_PAD, WING_PAD);
            g.scale(WING_SPR_W - WING_PAD * 2, WING_SPR_H - WING_PAD * 2);
            batWing(g, st);
            g.restore();
            pixelize(c, st.outline);
            return c;
        }
        WINGS.forEach(st => { st.sprite = buildWingSprite(st); });
        const wingRootPx = {
            x: WING_PAD + WING_ROOT.x * (WING_SPR_W - WING_PAD * 2),
            y: WING_PAD + WING_ROOT.y * (WING_SPR_H - WING_PAD * 2)
        };

        // Pangkal sayap di punggung atas (di bawah dagu, sumbu tengah badan), mengepak pelan.
        // Badan orang digambar ulang di atas sayap (drawPersonOver), jadi sayap terlihat di BELAKANG badan.
        function drawWings(fg, t, dt) {
            const spr = WINGS[styleIdx.wings].sprite;
            const ux = Math.cos(fg.angle), uy = Math.sin(fg.angle);
            const target = {
                x: fg.chin.x - uy * fg.head * CFG.WING_Y,
                y: fg.chin.y + ux * fg.head * CFG.WING_Y,
                a: fg.angle * 0.5, head: fg.head
            };
            // Posisi sayap dihaluskan per wajah: mengejar badan pelan-pelan, tidak menempel kaku ke landmark
            const tr = fg.track;
            if (!tr.wing) tr.wing = { ...target };
            const f = 1 - Math.exp(-CFG.WING_FOLLOW * dt);
            Object.keys(target).forEach(key => { tr.wing[key] += (target[key] - tr.wing[key]) * f; });
            const wg = tr.wing;

            const h = wg.head * CFG.WING_SCALE, k = h / spr.height, w = spr.width * k;
            // Kepakan pelan: rotasi + bentang sayap sedikit melebar/menyempit dengan jeda (terasa lebih lentur)
            const ph = t * CFG.WING_FLAP_SPEED + fg.id;
            const flap = Math.sin(ph) * CFG.WING_FLAP;
            const span = 1 + Math.sin(ph - 0.8) * 0.05;
            const lift = Math.cos(ph) * wg.head * 0.02;
            ctx.save();
            ctx.imageSmoothingEnabled = false;
            ctx.translate(wg.x, wg.y + lift); ctx.rotate(wg.a);
            [-1, 1].forEach(s => {
                ctx.save();
                ctx.scale(s, 1);
                ctx.translate(wg.head * CFG.WING_GAP, 0);
                ctx.rotate(-flap);
                ctx.scale(span, 2 - span);
                ctx.drawImage(spr, -wingRootPx.x * k, -wingRootPx.y * k, w, h);
                ctx.restore();
            });
            ctx.restore();
        }

        // ================== PERSON SEGMENTATION (badan di depan sayap) ==================
        let segmenter = null, segLoading = false, segData = null, segW = 0, segH = 0;
        const segInput = document.createElement('canvas');
        const segInputCtx = segInput.getContext('2d');
        const maskCanvas = document.createElement('canvas');
        const maskCtx = maskCanvas.getContext('2d');
        let maskImg = null;
        const personCanvas = document.createElement('canvas');
        const personCtx = personCanvas.getContext('2d');

        // Model segmentasi baru dimuat saat sayap pertama kali dinyalakan
        async function ensureSegmenter() {
            if (segmenter || segLoading || !visionLib) return;
            segLoading = true;
            try {
                segmenter = await visionLib.create(visionLib.ImageSegmenter, SEG_MODEL, { outputConfidenceMasks: true, outputCategoryMask: false });
            } catch (e) {
                console.error('Segmenter failed, wings will be drawn without body cut-out', e);
                toast('WINGS: SEGMENTATION NOT AVAILABLE');
            }
            segLoading = false;
        }

        function runSegmentation(ts) {
            const vw = video.videoWidth, vh = video.videoHeight;
            const sw = CFG.SEG_WIDTH, sh = Math.round(sw * vh / vw);
            if (segInput.width !== sw || segInput.height !== sh) { segInput.width = sw; segInput.height = sh; }
            segInputCtx.drawImage(video, 0, 0, sw, sh);
            try {
                segmenter.segmentForVideo(segInput, ts, res => {
                    const m = res.confidenceMasks && res.confidenceMasks[0];
                    if (!m) return;
                    const arr = m.getAsFloat32Array();
                    if (!segData || segData.length !== arr.length) { segData = new Float32Array(arr); segW = m.width; segH = m.height; }
                    else for (let i = 0; i < arr.length; i++) segData[i] += (arr[i] - segData[i]) * 0.7;   // redam kedip tepi
                });
            } catch (e) { console.warn(e); }
        }

        // Confidence -> alpha mask. Kalau nilai di tengah wajah rendah, berarti model mengeluarkan "background" -> dibalik.
        function updateMask(faces) {
            if (!segData) return false;
            let invert = false;
            if (faces.length) {
                const v = screenToVideo({ x: faces[0].cx, y: faces[0].cy });
                const mx = Math.min(segW - 1, Math.max(0, Math.round(v.x / video.videoWidth * segW)));
                const my = Math.min(segH - 1, Math.max(0, Math.round(v.y / video.videoHeight * segH)));
                invert = segData[my * segW + mx] < 0.5;
            }
            if (maskCanvas.width !== segW || maskCanvas.height !== segH || !maskImg) {
                maskCanvas.width = segW; maskCanvas.height = segH;
                maskImg = maskCtx.createImageData(segW, segH);
            }
            const d = maskImg.data;
            for (let i = 0; i < segData.length; i++) {
                const v = invert ? 1 - segData[i] : segData[i];
                d[i * 4 + 3] = Math.max(0, Math.min(255, (v - 0.35) * 850));
            }
            maskCtx.putImageData(maskImg, 0, 0);
            return true;
        }

        // Gambar ulang piksel orang (video x mask) di atas sayap
        function drawPersonOver(faces) {
            if (!updateMask(faces)) return;
            if (personCanvas.width !== canvas.width || personCanvas.height !== canvas.height) {
                personCanvas.width = canvas.width; personCanvas.height = canvas.height;
            }
            const p = personCtx;
            p.setTransform(1, 0, 0, 1, 0, 0);
            p.globalCompositeOperation = 'source-over';
            p.clearRect(0, 0, personCanvas.width, personCanvas.height);
            p.setTransform(dpr, 0, 0, dpr, 0, 0);
            p.translate(W, 0); p.scale(-1, 1);
            p.imageSmoothingEnabled = true;
            p.drawImage(maskCanvas, layout.ox, layout.oy, layout.dw, layout.dh);
            p.globalCompositeOperation = 'source-in';
            p.drawImage(video, layout.ox, layout.oy, layout.dw, layout.dh);
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.drawImage(personCanvas, 0, 0);
            ctx.restore();
        }

        function drawSkeletons() {
            ctx.save();
            ctx.strokeStyle = 'rgba(255,106,213,0.45)'; ctx.lineWidth = 1.5;
            hands.forEach(h => {
                ctx.beginPath();
                CONNECTIONS.forEach(([a, b]) => { ctx.moveTo(h.p[a].x, h.p[a].y); ctx.lineTo(h.p[b].x, h.p[b].y); });
                ctx.stroke();
                ctx.fillStyle = '#fff';
                h.p.forEach(q => ctx.fillRect(q.x - 2, q.y - 2, 4, 4));
            });
            ctx.restore();
        }

        function drawHUDCircle(x, y, progress, color) {
            ctx.save();
            ctx.shadowBlur = 10; ctx.shadowColor = color;
            ctx.beginPath();
            ctx.arc(x, y, 35, -Math.PI / 2, (-Math.PI / 2) + (Math.PI * 2 * progress));
            ctx.lineWidth = 5; ctx.strokeStyle = color; ctx.stroke();
            ctx.setLineDash([3, 5]);
            ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI * 2); ctx.lineWidth = 1; ctx.stroke();
            ctx.restore();
        }

        // ================== UI ==================
        let toastTimer = null;
        // Panel status sudah dihapus; pesan (termasuk error) tampil lewat toast. ms = lama tampil
        function toast(msg, ms = 1600) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms);
        }

        // ================== LAYOUT (DIGIFEST CAMP kiri atas + GROWTOPIA kanan bawah) ==================
        // Satu PNG layout seukuran frame (contoh 1024x570): logo kiri atas ada di kuadran kiri atas,
        // logo kanan bawah ada di kuadran kanan bawah. Tiap kuadran ditempel ke pojoknya sendiri,
        // jadi layout tetap pas di layar dengan rasio apa pun dan tidak ada logo yang terpotong.
        const layoutArt = { img: null, w: 0, h: 0 };

        // PNG tanpa transparansi (latar putih): buang putih yang tersambung ke tepi gambar (flood fill),
        // putih di dalam logo tetap utuh. Kalau piksel tidak bisa dibaca (halaman dibuka dari file://), gambar dipakai apa adanya.
        function keyOutWhite(img) {
            const w = img.naturalWidth, h = img.naturalHeight;
            const c = document.createElement('canvas'); c.width = w; c.height = h;
            const g = c.getContext('2d');
            g.drawImage(img, 0, 0);
            let data;
            try { data = g.getImageData(0, 0, w, h); }
            catch (e) { console.warn('Layout: pixel read blocked, white background kept. Run from a web server.', e); return img; }
            const d = data.data;
            const opaqueCorners = [0, w - 1, (h - 1) * w, h * w - 1].every(i => d[i * 4 + 3] === 255);
            if (!opaqueCorners) return img;             // PNG sudah transparan
            const T = CFG.LAYOUT_WHITE;
            const white = i => d[i * 4] > T && d[i * 4 + 1] > T && d[i * 4 + 2] > T;
            const seen = new Uint8Array(w * h), stack = [];
            const push = i => { if (!seen[i] && white(i)) { seen[i] = 1; stack.push(i); } };
            for (let x = 0; x < w; x++) { push(x); push((h - 1) * w + x); }
            for (let y = 0; y < h; y++) { push(y * w); push(y * w + w - 1); }
            while (stack.length) {
                const i = stack.pop(), x = i % w;
                d[i * 4 + 3] = 0;
                if (x > 0) push(i - 1);
                if (x < w - 1) push(i + 1);
                if (i >= w) push(i - w);
                if (i < w * (h - 1)) push(i + w);
            }
            g.putImageData(data, 0, 0);
            return c;
        }

        (function loadLayout() {
            const img = new Image();
            img.onload = () => {
                layoutArt.img = keyOutWhite(img);
                layoutArt.w = img.naturalWidth; layoutArt.h = img.naturalHeight;
            };
            img.onerror = () => { console.warn(`Layout not found: ${CFG.LAYOUT_SRC}`); toast(`LAYOUT NOT FOUND: ${CFG.LAYOUT_SRC}`, 8000); };
            img.src = CFG.LAYOUT_SRC;
        })();

        // c sudah dalam satuan piksel CSS (w x h)
        function drawLayout(c, w, h) {
            const L = layoutArt;
            if (!L.img) return;
            const k = Math.min(w / L.w, h / L.h) * CFG.LAYOUT_SCALE;
            const hw = L.w / 2, hh = L.h / 2;
            c.save();
            c.imageSmoothingEnabled = true;
            c.drawImage(L.img, 0, 0, hw, hh, 0, 0, hw * k, hh * k);                                  // kiri atas
            c.drawImage(L.img, hw, hh, L.w - hw, L.h - hh, w - (L.w - hw) * k, h - (L.h - hh) * k,   // kanan bawah
                (L.w - hw) * k, (L.h - hh) * k);
            c.restore();
        }

        // ================== PHOTO CAPTURE + UPLOAD + QR ==================
        const APP = Object.assign({ SUPABASE_URL: '', SUPABASE_ANON_KEY: '', BUCKET: 'fog-glass', FOLDER: 'filter-photos', VIEWER_URL: '' }, window.FILTER_SYNC_CONFIG || {});
        const supa = (APP.SUPABASE_URL && APP.SUPABASE_ANON_KEY && window.supabase)
            ? window.supabase.createClient(APP.SUPABASE_URL, APP.SUPABASE_ANON_KEY, { auth: { persistSession: false } })
            : null;

        const countdownEl = document.getElementById('countdown');
        const flashEl = document.getElementById('flash');
        const modalEl = document.getElementById('photo_modal');
        const previewEl = document.getElementById('photo_preview');
        const qrBox = document.getElementById('qr_box');
        const uploadStatusEl = document.getElementById('upload_status');
        const saveLocalEl = document.getElementById('save_local');
        const modalTimerEl = document.getElementById('modal_timer');
        const closeBtn = document.getElementById('close_modal');

        // Canvas foto: salinan layar (video + filter + layout) TANPA skeleton / ring HUD
        const photoCanvas = document.createElement('canvas');
        const photoCtx = photoCanvas.getContext('2d');

        let capState = 'idle';          // idle | countdown | snap | saving | modal
        let countdownTimer = null, modalTimer = null, photoUrl = null;

        function canCapture() { return capState === 'idle' && !!video.videoWidth; }
        const pad2 = n => String(n).padStart(2, '0');

        function randomId() {
            if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
            const b = crypto.getRandomValues(new Uint8Array(16));
            return Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
        }

        function startCountdown() {
            if (!canCapture()) return;
            capState = 'countdown';
            let n = CFG.COUNTDOWN;
            countdownEl.style.display = 'flex';
            countdownEl.textContent = n;
            countdownTimer = setInterval(() => {
                n--;
                if (n > 0) { countdownEl.textContent = n; return; }
                clearInterval(countdownTimer);
                countdownEl.style.display = 'none';
                countdownEl.textContent = '';
                capState = 'snap';              // foto diambil di frame() berikutnya
            }, 1000);
        }

        // Dipanggil dari frame() setelah layout digambar, sebelum skeleton / ring HUD -> foto bersih
        function takePhoto() {
            capState = 'saving';
            const s = Math.min(1, CFG.PHOTO_LONG_SIDE / Math.max(canvas.width, canvas.height));
            photoCanvas.width = Math.round(canvas.width * s);
            photoCanvas.height = Math.round(canvas.height * s);
            photoCtx.drawImage(canvas, 0, 0, photoCanvas.width, photoCanvas.height);
            flashEl.classList.remove('on'); void flashEl.offsetWidth; flashEl.classList.add('on');
            const d = new Date();
            photoCanvas.toBlob(blob => {
                if (!blob) { toast('PHOTO FAILED'); capState = 'idle'; return; }
                const fileName = `filter-sync-${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}-${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}.jpg`;
                showModal(blob, fileName);
                uploadPhoto(blob, d);
            }, 'image/jpeg', CFG.PHOTO_QUALITY);
        }

        function showModal(blob, fileName) {
            capState = 'modal';
            if (photoUrl) URL.revokeObjectURL(photoUrl);
            photoUrl = URL.createObjectURL(blob);
            previewEl.src = photoUrl;
            saveLocalEl.href = photoUrl;
            saveLocalEl.download = fileName;
            qrBox.textContent = 'GENERATING...';
            uploadStatusEl.textContent = 'UPLOADING...';
            modalEl.classList.add('open');
            closeBtn.focus();
            let left = CFG.MODAL_TIMEOUT;
            modalTimerEl.textContent = `AUTO-CLOSE IN ${left}s`;
            clearInterval(modalTimer);
            modalTimer = setInterval(() => {
                left--;
                modalTimerEl.textContent = `AUTO-CLOSE IN ${left}s`;
                if (left <= 0) closeModal();
            }, 1000);
        }

        function closeModal() {
            clearInterval(modalTimer);
            modalEl.classList.remove('open');
            capState = 'idle';
        }

        // VIEWER_URL dari config.js, atau photo.html di folder yang sama dengan halaman ini
        function viewerBase() { return APP.VIEWER_URL || new URL('photo.html', location.href).href; }
        function isLocalViewer(u) { return u.protocol === 'file:' || ['localhost', '127.0.0.1', '[::1]', '::1'].includes(u.hostname); }

        async function uploadPhoto(blob, d) {
            if (!supa) {
                qrBox.textContent = 'SUPABASE NOT CONFIGURED';
                uploadStatusEl.textContent = 'Isi config.js untuk QR. Gunakan SAVE LOCAL.';
                return;
            }
            const day = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
            const path = `${APP.FOLDER}/${day}/${randomId()}.jpg`;
            try {
                const { error } = await supa.storage.from(APP.BUCKET).upload(path, blob, {
                    contentType: 'image/jpeg', cacheControl: '3600', upsert: false
                });
                if (error) throw error;
                if (capState !== 'modal') return;          // modal sudah ditutup
                const viewer = new URL(viewerBase());
                viewer.searchParams.set('p', path);
                renderQR(viewer.href);
                console.info('Viewer:', viewer.href);
                uploadStatusEl.textContent = isLocalViewer(viewer)
                    ? 'WARNING: photo.html masih di localhost/file, HP tidak bisa membukanya. Isi VIEWER_URL di config.js.'
                    : 'SCAN TO SAVE / SHARE';
            } catch (err) {
                console.error('Upload failed:', err);
                qrBox.textContent = 'UPLOAD FAILED';
                const msg = err.message || String(err);
                uploadStatusEl.textContent = /mime|size|policy|security/i.test(msg)
                    ? `ERROR: ${msg}. Sudah jalankan supabase-photo-setup.sql?`
                    : `ERROR: ${msg}`;
            }
        }

        function renderQR(url) {
            const qr = qrcode(0, 'M');
            qr.addData(url);
            qr.make();
            const img = new Image();
            img.src = qr.createDataURL(8, 2);
            img.alt = 'QR code to save or share the photo';
            qrBox.replaceChildren(img);
        }

        closeBtn.addEventListener('click', closeModal);

        // ================== CAMERA + MEDIAPIPE TASKS ==================
        let handLandmarker = null, faceLandmarker = null, farLandmarker = null, farCount = 0;
        let visionLib = null;           // { create, ImageSegmenter } untuk model yang dimuat belakangan
        let lastVideoTime = -1, lastVisionTs = 0, visionTick = 0;

        async function startCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: { ideal: CFG.CAMERA_W }, height: { ideal: CFG.CAMERA_H }, facingMode: 'user' }, audio: false
            });
            video.srcObject = stream;
            await video.play();
        }

        async function initVision() {
            const { FilesetResolver, HandLandmarker, FaceLandmarker, ImageSegmenter } = await import(`${VISION_URL}/vision_bundle.mjs`);
            const fileset = await FilesetResolver.forVisionTasks(`${VISION_URL}/wasm`);
            const create = async (Task, modelAssetPath, options) => {
                try {
                    return await Task.createFromOptions(fileset, { baseOptions: { modelAssetPath, delegate: 'GPU' }, runningMode: 'VIDEO', ...options });
                } catch (e) {
                    console.warn('GPU delegate failed, falling back to CPU', e);
                    return await Task.createFromOptions(fileset, { baseOptions: { modelAssetPath, delegate: 'CPU' }, runningMode: 'VIDEO', ...options });
                }
            };
            visionLib = { create, ImageSegmenter };
            if (active.wings) ensureSegmenter();   // sayap sudah dinyalakan (keyboard) sebelum model siap
            handLandmarker = await create(HandLandmarker, HAND_MODEL, {
                numHands: CFG.MAX_HANDS, minHandDetectionConfidence: 0.55, minHandPresenceConfidence: 0.55, minTrackingConfidence: 0.55
            });
            // Confidence lebih rendah supaya wajah yang agak jauh / kecil tetap terdeteksi
            faceLandmarker = await create(FaceLandmarker, FACE_MODEL, {
                numFaces: CFG.MAX_FACES, minFaceDetectionConfidence: 0.35, minFacePresenceConfidence: 0.35, minTrackingConfidence: 0.35
            });
            // Landmarker kedua (mode IMAGE) khusus untuk potongan video yang di-zoom (wajah jauh)
            if (CFG.FAR_DETECTION) {
                try {
                    farLandmarker = await create(FaceLandmarker, FACE_MODEL, {
                        runningMode: 'IMAGE', numFaces: 4, minFaceDetectionConfidence: 0.4, minFacePresenceConfidence: 0.4
                    });
                } catch (e) {
                    console.error('Far-face landmarker failed, only near faces will be detected', e);
                }
            }
        }

        // Tangan tiap frame video baru, wajah full frame tiap 2 frame, potongan zoom tiap frame
        function runVision(now) {
            if (!handLandmarker || video.readyState < 2 || video.currentTime === lastVideoTime) return;
            lastVideoTime = video.currentTime;
            const ts = Math.max(now, lastVisionTs + 1);
            lastVisionTs = ts;
            updateHands(handLandmarker.detectForVideo(video, ts));
            if (segmenter && active.wings) runSegmentation(ts);
            if (faceLandmarker && (++visionTick % 2 === 0)) {
                const r = faceLandmarker.detectForVideo(video, ts);
                updateFaces((r && r.faceLandmarks) || [], 'full');
            }
            if (farLandmarker) runFarCrops();
            adaptBudget(performance.now() - now);
        }

        // Jumlah crop per frame menyesuaikan beban: kalau deteksi > budget, kurangi; kalau ringan, tambah lagi
        let cropBudget = CFG.CROPS_PER_FRAME, visionMs = 0, budgetCooldown = 0;
        function adaptBudget(ms) {
            visionMs = visionMs ? visionMs * 0.9 + ms * 0.1 : ms;
            if (--budgetCooldown > 0) return;
            if (visionMs > CFG.VISION_BUDGET_MS && cropBudget > 1) { cropBudget--; budgetCooldown = 30; }
            else if (visionMs < CFG.VISION_BUDGET_MS * 0.6 && cropBudget < CFG.CROPS_PER_FRAME) { cropBudget++; budgetCooldown = 30; }
        }

        // ================== FAR FACE DETECTION (zoom crop) ==================
        // Detektor wajah MediaPipe hanya untuk jarak dekat; wajah jauh terlalu kecil di full frame.
        // 1. SCAN: frame dibagi beberapa tile persegi yang saling tumpang tindih, lalu di-zoom
        //    (1 tile per frame, bergiliran) untuk menemukan wajah jauh yang baru.
        // 2. TRACK: wajah yang tidak terlihat oleh deteksi full frame dilacak lewat crop zoom di sekitar wajahnya.
        const cropCanvas = document.createElement('canvas');
        const cropCtx = cropCanvas.getContext('2d', { willReadFrequently: false });
        let scanIdx = 0, trackIdx = 0;

        // Tile persegi multi-skala, overlap 25% (wajah di batas tile tetap utuh di tile tetangga).
        // Urutan diselang-seling antar skala supaya kedua skala ter-scan merata. Di-cache per resolusi video.
        let tileCache = { key: '', tiles: [] };
        function scanTiles() {
            const vw = video.videoWidth, vh = video.videoHeight, key = `${vw}x${vh}`;
            if (tileCache.key === key) return tileCache.tiles;
            const perScale = CFG.SCAN_TILES.map(frac => {
                const ts = Math.round(Math.min(vh, vw * frac));
                const steps = len => {
                    if (len <= ts) return [0];
                    const n = Math.ceil((len - ts) / (ts * 0.75)) + 1;
                    return Array.from({ length: n }, (_, i) => Math.round(i * (len - ts) / (n - 1)));
                };
                const list = [];
                steps(vh).forEach(sy => steps(vw).forEach(sx => list.push({ sx, sy, sw: ts, sh: ts })));
                return list;
            });
            const tiles = [];
            for (let i = 0; i < Math.max(...perScale.map(l => l.length)); i++) perScale.forEach(l => { if (l[i]) tiles.push(l[i]); });
            tileCache = { key, tiles };
            return tiles;
        }

        // Koordinat layar -> koordinat piksel video asli (kebalikan toScreen)
        function screenToVideo(p) {
            return {
                x: (W - p.x - layout.ox) / layout.dw * video.videoWidth,
                y: (p.y - layout.oy) / layout.dh * video.videoHeight
            };
        }

        function trackCrop(t) {
            const vw = video.videoWidth, vh = video.videoHeight;
            const c = screenToVideo(mid(t.pts.eL, t.pts.eR));
            const fw = D(t.pts.sL, t.pts.sR) / layout.dw * vw;          // lebar wajah dalam piksel video
            const s = Math.round(Math.min(Math.min(vw, vh), Math.max(160, fw * CFG.FAR_TRACK_ZOOM)));
            const sx = Math.min(vw - s, Math.max(0, Math.round(c.x - s / 2)));
            const sy = Math.min(vh - s, Math.max(0, Math.round(c.y - s * 0.42)));   // sedikit ke atas: sisakan ruang dahi/rambut
            return { sx, sy, sw: s, sh: s };
        }

        function detectCrop(crop) {
            const vw = video.videoWidth, vh = video.videoHeight, C = CFG.CROP_SIZE;
            cropCanvas.width = C; cropCanvas.height = C;
            cropCtx.drawImage(video, crop.sx, crop.sy, crop.sw, crop.sh, 0, 0, C, C);
            let res;
            try { res = farLandmarker.detect(cropCanvas); } catch (e) { console.warn(e); return; }
            const list = [];
            ((res && res.faceLandmarks) || []).forEach(lm => {
                // Tolak wajah yang terpotong tepi crop (landmark-nya tidak akurat), kecuali tepi itu memang tepi video
                let x0 = 1, y0 = 1, x1 = 0, y1 = 0;
                lm.forEach(p => { if (p.x < x0) x0 = p.x; if (p.x > x1) x1 = p.x; if (p.y < y0) y0 = p.y; if (p.y > y1) y1 = p.y; });
                const m = 0.02;
                if ((x0 < m && crop.sx > 0) || (y0 < m && crop.sy > 0) ||
                    (x1 > 1 - m && crop.sx + crop.sw < vw) || (y1 > 1 - m && crop.sy + crop.sh < vh)) return;
                // Koordinat crop -> koordinat ternormalisasi full video
                list.push(lm.map(p => ({ x: (crop.sx + p.x * crop.sw) / vw, y: (crop.sy + p.y * crop.sh) / vh })));
            });
            updateFaces(list, 'crop');
        }

        function runFarCrops() {
            const now = performance.now();
            // Wajah yang tidak terlihat oleh deteksi full frame selama > 300 ms = wajah jauh
            const far = faceTracks.filter(t => now - t.time <= CFG.FACE_TIMEOUT && now - (t.fullTime || 0) > 300);
            farCount = far.length;
            const n = cropBudget;
            const tiles = scanTiles();
            for (let i = 0; i < n; i++) {
                // Selalu sisakan slot scan supaya wajah jauh yang baru tetap ditemukan
                const scanSlot = !far.length || (n === 1 ? visionTick % 2 === 1 : i === n - 1);
                detectCrop(scanSlot ? tiles[scanIdx++ % tiles.length] : trackCrop(far[trackIdx++ % far.length]));
            }
        }

        // ================== MAIN LOOP ==================
        let lastFrame = performance.now();
        function frame(now) {
            requestAnimationFrame(frame);
            const dtMs = Math.min(50, now - lastFrame);
            lastFrame = now;
            const dt = dtMs / 1000, t = now / 1000;
            if (!video.videoWidth) return;

            computeLayout();
            runVision(now);
            const faces = faceGeoms();
            const g = detectGesture(faces);
            processGesture(g, dtMs);
            updatePartyAnchor(faces);
            // Selama sign F / DigiFest masih ditahan, tulisan tetap tampil
            if (g && (g.type === 'binus' || g.type === 'digifest') && gest.latched === g.type) party.until = Math.max(party.until, now + 1500);
            // Selama rock sign ditahan, jaring ikut tangan dan tetap tampil
            if (g && g.type === 'spider' && gest.latched === 'spider') {
                web.until = Math.max(web.until, now + 1200);
                web.x += (g.x - web.x) * 0.35; web.y += (g.y - web.y) * 0.35;
            }
            const partyOn = now < party.until + CFG.PARTY_FADE;

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.save();
            ctx.translate(W, 0); ctx.scale(-1, 1);
            ctx.drawImage(video, layout.ox, layout.oy, layout.dw, layout.dh);
            ctx.restore();

            // Aksesoris dipasang ke SEMUA wajah yang terdeteksi
            // Sayap dulu, lalu badan orang digambar ulang di atasnya -> sayap di belakang badan
            if (active.wings && faces.length) {
                faces.forEach(fg => drawWings(fg, t, dt));
                if (segmenter) drawPersonOver(faces);
            }
            faces.forEach(fg => {
                if (active.hearts) { spawnHearts(fg, dt); drawEyeHearts(fg, t); }
                if (active.glasses) drawGlasses(fg, t);
            });
            updateDrawHearts(dt);
            if (now < web.until + CFG.WEB_FADE) drawWeb(now);
            if (partyOn) drawPartyText(now);
            updateDrawConfetti(dt, party.confetti && now < party.until);

            // Layout logo selalu tampil; foto diambil SEBELUM skeleton / ring HUD, jadi fotonya bersih
            drawLayout(ctx, W, H);
            if (capState === 'snap') takePhoto();

            if (showSkeleton) drawSkeletons();
            if (g && gest.hold === g.type) drawHUDCircle(g.x, g.y, Math.min(1, gest.time / holdNeeded(g.type)), GESTURE_COLOR[g.type]);
        }

        // ================== EVENTS / BOOT ==================
        let resizeTimer = null;
        window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 150); });
        window.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();
            if (k === 'escape') { if (capState === 'modal') closeModal(); return; }
            if (capState === 'modal') return;
            if (k === 'v') startCountdown();
            else if (k === '1') fire('glasses');
            else if (k === '2') fire('hearts');
            else if (k === '3') fire('wings');
            else if (k === 's') fire('spider');
            else if (k === 'd') fire('digifest');
            else if (k === 'b') fire('binus');
            else if (e.key === 'ArrowRight') cycleStyle(1);
            else if (e.key === 'ArrowLeft') cycleStyle(-1);
            else if (k === 'h') showSkeleton = !showSkeleton;
            else if (k === 'x') resetAll();
        });

        resize();
        requestAnimationFrame(frame);
        startCamera().catch(err => { console.error(err); toast('CAMERA_ERROR: ' + err.message, 15000); });
        initVision().catch(err => { console.error(err); toast('VISION_ERROR: ' + err.message, 15000); });
    </script>
</body>
